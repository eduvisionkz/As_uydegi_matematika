/* Макет: «дастархан» — ою-өрнекті түрлі-түсті мұқабалары бар қазақ ас үйі сайты. Басты бетте іздеу, күн рецепті, жинақтар; рецептте порция, өлшем, пісіру режимі. Түстер: лазурит, алтын, анар. */
:root{
  --bg:#f4efe5; --surface:#fffdf8; --surface-2:#ede6d8; --ink:#1d2b2c; --muted:#5f6a68; --line:#e2d9c8;
  --lapis:#17575b; --lapis-ink:#ffffff; --gold:#9c7430; --gold-soft:#f1e6cf; --pom:#b5552f; --ok:#4f7a3a; --warn:#b4541a; --bad:#b3392f;
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#16201f; --surface-2:#1f2b2a; --ink:#eef2ef; --muted:#b3a99b; --line:#34302b;
  --lapis:#7cc6c4; --lapis-ink:#0d2223; --gold:#d9b46a; --gold-soft:#33291a; --pom:#e5916f; --ok:#9cc583; --warn:#f0a066; --bad:#ef8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#16201f; --surface-2:#1f2b2a; --ink:#eef2ef; --muted:#b3a99b; --line:#34302b;
  --lapis:#7cc6c4; --lapis-ink:#0d2223; --gold:#d9b46a; --gold-soft:#33291a; --pom:#e5916f; --ok:#9cc583; --warn:#f0a066; --bad:#ef8a80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ru{display:block;color:var(--muted);font-size:.88em;font-weight:400;font-family:var(--f-body);letter-spacing:0}
#app[data-lang="kk"] .ru{display:none}
#app[data-lang="ru"] .kk{display:none}
#app[data-lang="ru"] .ru{display:inline;color:inherit;font-size:1em;font-weight:inherit;font-family:inherit}
.il .ru{display:inline}
#app[data-lang="both"] .il .ru::before{content:" · "}
#app[data-lang="both"] .dnav .ru,#app[data-lang="both"] .logo small .ru,#app[data-lang="both"] .bnav .ru{display:none}
.shell{max-width:1180px;margin:0 auto;padding-inline:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .shell{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;margin-right:auto}
.logo svg{width:36px;height:36px;flex:0 0 auto}
.logo b{font-family:var(--f-display);font-size:.95rem;display:block;line-height:1.1}
.logo small{color:var(--muted);font-size:.74rem}
@media(max-width:520px){.logo small{display:none}.logo b{font-size:.85rem}#langSeg button{padding:5px 8px;font-size:.78rem}#langSeg{flex-wrap:nowrap}}
.dnav{display:none;gap:2px}
.dnav button{border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.92rem}
.dnav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
@media(min-width:1020px){.dnav{display:flex}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.84rem;font-weight:500;color:var(--muted)}

let patN=0;
function patSvg(motif,color,op=.22,size=60){const id="p"+(patN++);return `<svg class="pat" aria-hidden="true"><defs><pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse"><g style="color:${color}" opacity="${op}">${MOT[motif]}</g></pattern></defs><rect width="100%" height="100%" fill="url(#${id})"/></svg>`}
function photo(id){return mem.photos[id]||null}
// Фотолар телефонның IndexedDB қоймасында сақталады (көлемі localStorage-тен әлдеқайда үлкен)
const PDB={db:null,
  open(){return new Promise(res=>{try{const rq=indexedDB.open("aum3_photos",1);rq.onupgradeneeded=()=>rq.result.createObjectStore("p");rq.onsuccess=()=>{PDB.db=rq.result;res(true)};rq.onerror=()=>res(false)}catch(e){res(false)}})},
  all(){return new Promise(res=>{if(!PDB.db)return res({});try{const out={};const tx=PDB.db.transaction("p","readonly");const cur=tx.objectStore("p").openCursor();cur.onsuccess=()=>{const c=cur.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};cur.onerror=()=>res(out)}catch(e){res({})}})},
  put(id,v){return new Promise(res=>{if(!PDB.db)return res(false);try{const tx=PDB.db.transaction("p","readwrite");tx.objectStore("p").put(v,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})},
  del(id){return new Promise(res=>{if(!PDB.db)return res(false);try{const tx=PDB.db.transaction("p","readwrite");tx.objectStore("p").delete(id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}};
async function savePhoto(id,url){mem.photos[id]=url;let ok=await PDB.put(id,url);if(!ok)ok=store.set("ph_"+id,url);store.set("phd_"+id,new Date().toISOString().slice(0,10));return ok}
async function delPhoto(id){delete mem.photos[id];await PDB.del(id);store.del("ph_"+id);store.del("phd_"+id)}
function readImage(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",0.8))};im.onerror=rej;im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}

function amount(key,v,M){
  const F=FOOD[key];
  if(DRY.includes(key)&&S.unit!=="gram"){
    const g=v; const ownT=M.src.tbsp[key]==="mine", ownS=M.src.tsp[key]==="mine";
    if(S.unit==="glass"&&glassG(key)){const gl=g/glassG(key);if(gl>=0.25){const r=Math.round(gl*4)/4;return {main:`${f(g,g<10?1:0)} г`,sub:[B(`≈ ${nice(r,0.25)} стақан (${nice(r,0.25)} × ${f(glassG(key))} ≈ ${f(r*glassG(key))} г)`,`≈ ${nice(r,0.25)} стак. (${nice(r,0.25)} × ${f(glassG(key))} ≈ ${f(r*glassG(key))} г)`,1)],tag:"own"};}}
    // бір дөңгелектеу ережесі: жарты қасыққа дейін, сосын сол санның массасы көрсетіледі
    const tb=g/M.m.tbsp[key], ts=g/M.m.tsp[key];
    if(tb>12) return {main:`${f(g,0)} г`,sub:[B("12 ас қасықтан көп — қасықпен бағаламаймыз, таразымен өлшеңіз","больше 12 ст. ложек — ложками не оцениваем, взвесьте",1)],tag:ownT?"mine":"exp"};
    if(tb>=0.75){const r=Math.round(tb*2)/2;return {main:`${f(g,g<10?1:0)} г`,sub:[B(`≈ ${nice(r)} ас қасық (${nice(r)} × ${f(M.m.tbsp[key])} ≈ ${f(r*M.m.tbsp[key])} г)`,`≈ ${nice(r)} ст. л. (${nice(r)} × ${f(M.m.tbsp[key])} ≈ ${f(r*M.m.tbsp[key])} г)`,1)],tag:ownT?"mine":"exp"};}
    if(ts>=0.25){const r=Math.round(ts*4)/4;return {main:`${f(g,g<10?1:0)} г`,sub:[B(`≈ ${nice(r,0.25)} шай қасық (${nice(r,0.25)} × ${f(M.m.tsp[key])} ≈ ${f(r*M.m.tsp[key])} г)`,`≈ ${nice(r,0.25)} ч. л. (${nice(r,0.25)} × ${f(M.m.tsp[key])} ≈ ${f(r*M.m.tsp[key])} г)`,1)],tag:ownS?"mine":"exp"};}
    return {main:`${f(g)} г`,sub:[B("бір шымшым","щепотка",1)],tag:"exp"};
  }
  if(F.u==="g") return {main:v>=1000?`${f(v/1000,3)} кг`:`${f(v,v<10?1:0)} г`,sub:[]};
  if(F.u==="ml"){ if(S.unit==="glass"){const gl=v/S.glassMl; if(gl>=0.25){const r=Math.round(gl*4)/4;return {main:`${f0(v)} мл`,sub:[B(`≈ ${nice(r,0.25)} стақан (${S.glassMl} мл)`,`≈ ${nice(r,0.25)} стак. (${S.glassMl} мл)`,1)],tag:"vol"};}} return {main:v>=1000?`${f(v/1000,3)} л`:`${f0(v)} мл`,sub:[]}; }
  const whole=Math.abs(v-Math.round(v))<0.01; return {main:`${whole?f0(v):"≈ "+(nice(v)||f(v))} ${B("дана","шт.",1)}`,sub:whole?[]:[B("бүтін санға дөңгелектеңіз","округлите до целого",1)]};
}
function cost(r,k){let t=0,ex=false;r.ing.forEach(([key,v,fry])=>{const F=FOOD[key];const q=fry?v:v*k;const pr=priceOf(key);if(priceIsExample(key)&&F.price)ex=true;t+=F.pu==="pc"?q*pr:(q/1000)*pr});return{t,ex}}

const timers={}; // кілт: "id:step" → {left,run,iv}
function fmtClock(s){s=Math.max(0,Math.round(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return hh?`${hh}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`}
let audioCtx=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;[0,0.35,0.7].forEach(d=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.28);o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+0.3)})}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function timerBtn(key,min){const tm=timers[key];const left=tm?tm.left:min*60;const cls=tm&&tm.left<=0?"done":tm&&tm.run?"run":"";
  return `<button class="tbtn ${cls}" type="button" data-timer="${key}" data-min="${min}">${ico(tm&&tm.run?"pause":tm&&tm.left<=0?"bell":"play")} ${tm&&tm.left<=0?B("Дайын!","Готово!",1):fmtClock(left)}</button>`}
function toggleTimer(key,min,onTick){let tm=timers[key];if(!tm){tm=timers[key]={left:min*60,run:false,iv:null}}
  if(tm.left<=0){tm.left=min*60}
  if(tm.run){tm.run=false;clearInterval(tm.iv)}else{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
    tm.run=true;let last=Date.now();tm.iv=setInterval(()=>{const now=Date.now();tm.left-=(now-last)/1000;last=now;if(tm.left<=0){tm.left=0;tm.run=false;clearInterval(tm.iv);beep();toast(B("Таймер аяқталды","Таймер завершён",1))}document.querySelectorAll(`[data-timer="${key}"]`).forEach(b=>b.outerHTML=timerBtn(key,min));bindTimers();onTick&&onTick()},500)}
  document.querySelectorAll(`[data-timer="${key}"]`).forEach(b=>b.outerHTML=timerBtn(key,min));bindTimers();}
function bindTimers(){document.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>toggleTimer(b.dataset.timer,+b.dataset.min))}

let wake=null;
function openCook(r){
  const root=document.getElementById("cookRoot"); let i=0;

  const close=()=>{root.innerHTML="";document.body.style.overflow="";try{wake&&wake.release()}catch(e){}wake=null;document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight"&&i<r.st.length-1){i++;draw()}if(e.key==="ArrowLeft"&&i>0){i--;draw()}};
  const draw=()=>{const s=r.st[i];const tk=r.id+":"+i;const tm=timers[tk];
    root.innerHTML=`<div class="cook" role="dialog" aria-modal="true" aria-label="Пісіру режимі">
     <div><div class="top"><h3>${L(r.t,1)}</h3><button class="btn ghost sm" type="button" id="ckX">${ico("x")} ${B("Жабу","Закрыть",1)}</button></div><div class="bar"><i style="width:${(i+1)/r.st.length*100}%"></i></div></div>
     <div class="body"><div class="sn">${B(`${i+1}-қадам / ${r.st.length}`,`Шаг ${i+1} из ${r.st.length}`,1)}</div><div class="stx">${B(s[0],s[1])}</div>
      ${s[2]?`<div class="timer"><span class="clock" id="ckClock">${tm&&tm.left<=0?"0:00":fmtClock(tm?tm.left:s[2]*60)}</span>${timerBtn(tk,s[2])}</div>`:""}
      ${i===r.st.length-1&&r.warn?`<div class="note">${L(r.warn)}</div>`:""}</div>
     <div class="nav"><button class="btn ghost" type="button" id="ckP" ${i===0?"disabled":""}>← ${B("Артқа","Назад",1)}</button>${i<r.st.length-1?`<button class="btn" type="button" id="ckN">${B("Келесі","Далее",1)} →</button>`:`<button class="btn gold" type="button" id="ckD">${B("Дайын!","Готово!",1)}</button>`}</div></div>`;
    document.body.style.overflow="hidden";
    document.getElementById("ckX").onclick=close;
    const p=document.getElementById("ckP"); if(p) p.onclick=()=>{i--;draw()};
    const nx=document.getElementById("ckN"); if(nx) nx.onclick=()=>{i++;draw()};
    const d=document.getElementById("ckD"); if(d) d.onclick=()=>{store.set("done_"+r.id,true);close();toast(B("Ас болсын!","Приятного аппетита!",1));route()};
    root.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>{toggleTimer(b.dataset.timer,+b.dataset.min,()=>{const c=document.getElementById("ckClock");const t=timers[tk];if(c&&t)c.textContent=fmtClock(Math.max(0,t.left))});draw()});
  };
  document.addEventListener("keydown",key); draw();
}

function lsDump(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("aum3_")&&!k.startsWith("aum3_ph_"))o[k]=localStorage.getItem(k)}}catch(e){}return o}
function lsRestore(o){let n=0;for(const k in (o||{})){if(!k.startsWith("aum3_")||k.startsWith("aum3_ph_")||typeof o[k]!=="string")continue;try{JSON.parse(o[k]);localStorage.setItem(k,o[k]);n++}catch(e){}}
  const ns=store.get("s",null); if(ns&&typeof ns==="object"){for(const k of Object.keys(S))if(!(k in ns))delete S[k];Object.assign(S,ns);} return n}
function collectData(){const data={app:"as-uydegi-matematika",v:2,date:new Date().toISOString(),photos:Object.assign({},mem.photos),done:{},notes:{},dates:{},settings:{my:S.my,glassG:S.glassG,glassMl:S.glassMl,prices:S.prices,fav:S.fav,plan:S.plan,packs:S.packs||{},guests:S.guests},ls:lsDump()};
  R.forEach(r=>{if(store.get("done_"+r.id,false))data.done[r.id]=true;const n=store.get("note_"+r.id,"");if(n)data.notes[r.id]=n;const d=store.get("phd_"+r.id,"");if(d)data.dates[r.id]=d});return data}
async function saveFile(name,blob,msg,okText){
  try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){ await dl.save({filename:name,data:blob}); msg.innerHTML=okText; return; } }catch(e){ msg.innerHTML=B("Сақтау тоқтатылды.","Сохранение отменено.",1); return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500); msg.innerHTML=okText+" "+B("(«Жүктеулер» қалтасы)","(папка «Загрузки»)",1);}
  catch(e){ msg.innerHTML=`<span class="err">${B("Бұл жерде файл жүктеу мүмкін емес. Офлайн нұсқаны (HTML файл) пайдаланыңыз.","Здесь нельзя скачать файл. Используйте офлайн-версию (HTML-файл).",1)}</span>`; } }
async function exportApp(){

  const v=clone.querySelector("#view"); if(v) v.innerHTML=""; const cr=clone.querySelector("#cookRoot"); if(cr) cr.innerHTML=""; clone.querySelectorAll(".toast").forEach(t=>t.remove());
  const sc=document.createElement("script"); sc.type="application/json"; sc.id="aumSeed"; sc.textContent=JSON.stringify(data).replace(/</g,"\\u003c"); (clone.querySelector("body")||clone).appendChild(sc);
  const html="<!doctype html>\n"+clone.outerHTML; const name=`As_uydegi_matematika_foto_${data.date.slice(0,10)}.html`;
  await saveFile(name,new Blob([html],{type:"text/html"}),msg,B(`«${name}» сақталды. Оны флешкаға көшіріңіз.`,`«${name}» сохранён. Скопируйте его на флешку.`,1));
}
async function exportBackup(){

  await saveFile(name,new Blob([JSON.stringify(data)],{type:"application/json"}),document.getElementById("bkMsg"),B(`«${name}» сақталды.`,`«${name}» сохранён.`,1));

function importBackup(file){ if(!file) return; const msg=document.getElementById("bkMsg"); const rd=new FileReader();
  rd.onload=async()=>{ try{ const d=JSON.parse(rd.result); if(d.app!=="as-uydegi-matematika") throw 0;
      for(const id in (d.photos||{})) if(R.find(r=>r.id===id)) await savePhoto(id,d.photos[id]);
      for(const id in (d.done||{})) store.set("done_"+id,true); for(const id in (d.notes||{})) store.set("note_"+id,d.notes[id]); for(const id in (d.dates||{})) store.set("phd_"+id,d.dates[id]);
      if(d.ls){ lsRestore(d.ls); }
      else if(d.settings){ Object.assign(S,{my:d.settings.my||S.my,glassG:d.settings.glassG||S.glassG,glassMl:d.settings.glassMl||S.glassMl,prices:d.settings.prices||S.prices,fav:d.settings.fav||S.fav,plan:d.settings.plan||S.plan,packs:d.settings.packs||S.packs,guests:d.settings.guests||S.guests}); save(); }
      setLang(S.lang); pageAlbum(); toast(B("Көшірме ашылды","Копия восстановлена",1));
    }catch(e){ msg.innerHTML=`<span class="err">${B("Бұл файл осы қосымшаның көшірмесі емес.","Этот файл не является копией этого приложения.",1)}</span>`; } };
  rd.readAsText(file); }

const tagHtml=t=>`<span class="dtag ${t}">${L(TAG[t],1)}</span>`;

// ---------- сандар ----------
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function fracStr(x,maxD=12){ // x-ті жай бөлшекпен жазу (мүмкін болса)
  for(let d=1;d<=maxD;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){const g=gcd(n,d);const a=n/g,b=d/g;if(b===1)return String(a);const w=Math.floor(a/b),r=a%b;return w?`${w} ${r}/${b}`:`${a}/${b}`}}return null}
function parseAns(t){t=String(t??"").trim().toLowerCase().replace(/\s+/g," ").replace(/[−–]/g,"-");if(t==="")return null;
  if(["жоқ","нет","жок"].includes(t))return "none";

  return null}

function cmpCol(kind,k,a){const rows=ZH.map(z=>({n:z.n,v:kind==="mul"?z.m*k:z.m+a}));const r0=rows[0].v/rows[1].v;const tot=rows.reduce((s,x)=>s+x.v,0);
  return `<div><h4>${kind==="mul"?B(`Көбейту: × ${fracStr(k,12)||f(k,3)}`,`Умножение: × ${fracStr(k,12)||f(k,3)}`):B(`Қосу: + ${f(a,2)} г`,`Прибавление: + ${f(a,2)} г`)}</h4><div class="tw"><table><tbody>${rows.map(r=>`<tr><td>${L(r.n,1)}</td><td>${gm(r.v)} г</td></tr>`).join("")}<tr><th>${B("Барлығы","Всего",1)}</th><th>${gm(tot)} г</th></tr></tbody></table></div>
  <p class="kline">${B("Тары өнімі : май","Продукт из проса : масло",1)} = ${gm(rows[0].v)} : ${gm(rows[1].v)} = <b>${ratioOf(rows[0].v,rows[1].v)}</b> ${Math.abs(r0-2)<1e-9?`<span class="okt">${B("сақталды","сохранилось",1)}</span>`:`<span class="err">${B("өзгерді","изменилось",1)}</span>`}</p>
  ${stackBar(rows.map(r=>r.v),["var(--lapis)","var(--gold)","var(--pom)","var(--ok)"],rows.map(r=>r.n))}</div>`}
function cmpConcl(k,a){
  const mulT=Math.abs(k-1)<1e-12?B("k = 1 болғанда мөлшерлер өзгермейді, қатынас 2 : 1 болып қалады.","При k = 1 количества не меняются, отношение остаётся 2 : 1.",1)
    :k>1?B(`Көбейтуде әр ингредиент ${kTxt(k)} есе өседі, сондықтан 2 : 1 қатынас сақталады.`,`При умножении каждый ингредиент увеличивается в ${kTxt(k)} раза, поэтому отношение 2 : 1 сохраняется.`,1)
    :B(`k = ${kTxt(k)} < 1, сондықтан көбейткенде әр ингредиент азаяды (бастапқының ${kTxt(k)} бөлігі қалады). Барлығы бірдей азайғандықтан, 2 : 1 қатынас сақталады.`,`k = ${kTxt(k)} < 1, поэтому при умножении каждый ингредиент уменьшается (остаётся ${kTxt(k)} исходного). Все уменьшаются одинаково, поэтому отношение 2 : 1 сохраняется.`,1);
  const p=300+a,q=150+a,sh0=50,sh1=p/(600+4*a)*100;
  const addT=a===0?B("0 г қосқанда мөлшерлер өзгермейді, сондықтан қатынас 2 : 1 сақталады.","При прибавлении 0 г количества не меняются, поэтому отношение 2 : 1 сохраняется.",1)
    :B(`Әрқайсысына ${f(a,2)} г қосқанда қатынас 300 : 150 = 2 : 1 болғаннан ${gm(p)} : ${gm(q)} = ${ratioOf(p,q)} болды (2-нің орнына ${EQ(p/q,3)==="="?"":"≈ "}${f(p/q,3)}). Кіші мөлшерге салыстырмалы түрде көбірек қосылды: тары өнімінің үлесі ${sh0}%-дан ${EQ(sh1,2)==="="?"":"≈ "}${f(sh1,2)}%-ға өзгерді.`,
       `При прибавлении по ${f(a,2)} г отношение 300 : 150 = 2 : 1 стало ${gm(p)} : ${gm(q)} = ${ratioOf(p,q)} (${EQ(p/q,3)==="="?"":"≈ "}${f(p/q,3)} вместо 2). К меньшему количеству добавилось относительно больше: доля продукта из проса изменилась с ${sh0}% до ${EQ(sh1,2)==="="?"":"≈ "}${f(sh1,2)}%.`,1);
  return `<div class="concl"><span class="eyebrow">${B("Қорытынды","Вывод",1)}</span><p>${mulT} ${addT}</p></div>`}
function stackBar(vals,cols,names){const t=vals.reduce((s,x)=>s+x,0)||1;return `<div class="sbar">${vals.map((v,i)=>`<i style="width:${v/t*100}%;background:${cols[i]}" title="${names[i][0]}"></i>`).join("")}</div><div class="sleg">${vals.map((v,i)=>`<span><i style="background:${cols[i]}"></i>${L(names[i],1)} ${f(v/t*100,2)}%</span>`).join("")}</div>`}

    <div class="stack"><div class="card"><h3>${B("Есеп","Вычисление")}</h3><div class="tw"><table><thead><tr><th>${B("Ингредиент","Ингредиент",1)}</th><th>${B("Бастапқы","Исходно",1)}</th><th>${B("Есеп","Расчёт",1)}</th><th>${B("Жаңа","Новое",1)}</th></tr></thead><tbody>
      ${BA.map(x=>`<tr><td>${L(x.n,1)}</td><td>${f(val(x.v),dig)} ${unit(x.u,!small)}</td><td class="kline" style="margin:0">${f(val(x.v),dig)} × ${fracStr(k,12)||f(k,4)}</td><td><b>${EQ(val(x.v)*k,dig)==="≈"?"≈ ":""}${f(val(x.v)*k,dig)} ${unit(x.u,!small)}</b>${small?"":` <span class="kline">${EQ(x.v*k*1000,1)} ${f(x.v*k*1000,1)} ${unit(x.u,false)}</span>`}</td></tr>`).join("")}</tbody></table></div>
      <p class="kline">${B("Сүт литрмен (көлем), қалғандары килограммен (масса) берілген, сондықтан оларды бір «жалпы массаға» қоспаймыз.","Молоко дано в литрах (объём), остальное — в килограммах (масса), поэтому их не складываем в одну «общую массу».")}</p></div>

     ${concl(["Ондық бөлшекпен амал және бірлікті дұрыс түрлендіру мөлшерді жоспарлауға көмектеседі. Есептік карта тағамның дайын массасын немесе дәмін болжамайды.","Действия с десятичными дробями и правильный перевод единиц помогают планировать количество. Расчётная карта не предсказывает готовую массу или вкус блюда."])}</div></div>`;
    const setK=()=>{const r=chk(document.getElementById("baK").value,{max:100,what:["Коэффициент k","Коэффициент k"]});if(r.err){document.getElementById("baErr").innerHTML=r.err;return}const v=r.v;k=v;store.set("baK",k);draw()};

    document.getElementById("baU").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;small=b.dataset.s==="1";store.set("baSmall",small);draw()};
    const setS=()=>{const r=chk(document.getElementById("baS").value,{max:1000,what:["Ұн қоры","Запас муки"]});if(r.err){document.getElementById("baSErr").innerHTML=r.err;return}const v=r.v;stock=v;store.set("baStock",stock);draw()};
    document.getElementById("baSGo").onclick=setS; document.getElementById("baS").onkeydown=e=>{if(e.key==="Enter")setS()};
  };
  draw();
}

function pageData(sub){
  const cur=sub||"main";
  view.innerHTML=`<section class="sec"><div class="sec-h"><div><h2>${B("Өлшеулерді талда","Анализируй измерения")}</h2><p class="lead">${B("Қант, күріш, тұз және ұн шай және ас қасықпен бес реттен өлшенген — барлығы 40 масса (г). Бастапқы мәндер өзгертілмейді.","Сахар, рис, соль и мука измерены чайной и столовой ложкой по пять раз — всего 40 масс (г). Исходные значения не меняются.")}</p></div></div>
  ${tabs("dTabs",[["main",["Зерттеу деректері","Данные исследования"]],["sum",["Барлық қатарлар","Все ряды"]],["spoon",["Қасықтан грамға","Ложки в граммы"]],["mine",["Өз өлшеуім (қосымша)","Мои измерения (доп.)"]]],cur)}
  <div id="dBody" style="margin-top:16px"></div></section>`;
  document.getElementById("dTabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;pageData(b.dataset.t)};
  ({main:dataMain,sum:dataSum,spoon:dataSpoon,mine:dataMine}[cur])(document.getElementById("dBody"));
}
function dataMain(el){
  let p=store.get("dP","rice"), k=store.get("dK","tsp"), step=6;
  const draw=()=>{
    const a=RAW[k][p], st=stats(a);
    const steps=[
      [B("Қосынды","Сумма"),`${a.join(" + ")} = <b>${st.sum}</b> г`],
      [B("Орташа арифметикалық","Среднее арифметическое"),`${st.sum} : 5 = <b>${f(st.mean,2)}</b> г`],
      [B("Реттелген қатар","Упорядоченный ряд"),st.sorted.join(", ")],
      [B("Медиана","Медиана"),`${B("ортадағы (3-) мән","средний (3-й) член",1)}: <b>${f(st.median)}</b> г`],
      [B("Мода","Мода"),st.mode?`${B("ең жиі","чаще всего",1)} (${st.freq} ${B("рет","раза",1)}): <b>${modeTxt(st)}</b> г`:`<b>${modeTxt(st)}</b> — ${B("барлық мән бір реттен кездеседі","все значения встречаются по одному разу",1)}`],
      [B("Ең кіші, ең үлкен, құлаш","Мин., макс., размах"),`min ${st.min}, max ${st.max}; ${B("құлаш","размах",1)} ${st.max} − ${st.min} = <b>${st.range}</b> г`]];
    el.innerHTML=`<div class="two"><div class="stack">
     ${qbox(["Бір өнімді бір қасықпен бес рет өлшегенде нәтиже қаншалықты өзгереді? Бір сан бәрін сипаттай ма?","Насколько меняется результат, если одну и ту же ложку набрать пять раз? Описывает ли одно число все значения?"],tagHtml("real"))}
     <div class="card"><span class="lbl">${B("Өнім","Продукт",1)}</span><div class="seg" id="dP">${DRY.map(x=>`<button type="button" data-p="${x}" aria-pressed="${x===p}">${L(PN[x],1)}</button>`).join("")}</div>
      <span class="lbl" style="margin-top:10px">${B("Қасық","Ложка",1)}</span><div class="seg" id="dK"><button type="button" data-k="tsp" aria-pressed="${k==="tsp"}">${B("Шай қасық","Чайная",1)}</button><button type="button" data-k="tbsp" aria-pressed="${k==="tbsp"}">${B("Ас қасық","Столовая",1)}</button></div>
      <p class="kline">${B("Бастапқы қатар","Исходный ряд",1)}: <b>${a.join(", ")}</b> г</p></div>
     <div class="card"><h3>${B("Есептеу қадамдары","Шаги вычисления")}</h3><ol class="steps">${steps.map(([t,v],i)=>`<li class="${i<step?"":"hid"}"><div><b>${t}</b><div>${v}</div></div></li>`).join("")}</ol>
      <div class="row" style="margin-top:8px"><button class="btn sm ghost" type="button" id="stReset">${B("Қадамдап көрсету","Показать по шагам",1)}</button>${step<6?`<button class="btn sm" type="button" id="stNext">${B("Келесі қадам","Следующий шаг",1)} (${step}/6)</button>`:""}</div></div></div>
    <div class="stack"><div class="card"><h3>${B("Бес өлшеу","Пять измерений")} · ${L(PN[p],1)}, ${L(k==="tsp"?["шай қасық","чайная ложка"]:["ас қасық","столовая ложка"],1)}</h3>
      ${barSvg({values:a,labels:["1","2","3","4","5"],max:k==="tsp"?12:20,lines:Math.abs(st.mean-st.median)<1e-9?[{v:st.mean,c:"var(--pom)",t:tl("орташа = медиана","среднее = медиана")}]:[{v:st.mean,c:"var(--pom)",t:tl("орташа","среднее"),dy:st.mean>=st.median?-6:8},{v:st.median,c:"var(--ok)",t:"медиана",dash:"2 3",dy:st.median>st.mean?-6:8}]})}
      <div class="kpis"><div class="kpi"><b>${f(st.mean,2)}</b><span>${B("орташа","среднее",0)}</span></div><div class="kpi"><b>${f(st.median)}</b><span>${B("медиана","медиана",0)}</span></div><div class="kpi"><b>${st.mode?modeTxt(st):"—"}</b><span>${st.mode?B("мода","мода",0):B("мода жоқ","моды нет",0)}</span></div><div class="kpi"><b>${st.range}</b><span>${B("құлаш","размах",0)}</span></div></div></div>
     ${concl([`Орташа ${f(st.mean,2)} г барлық бес мәнді ескереді, медиана ${f(st.median)} г — қатардың ортасы. Құлаш ${st.range} г мәндердің қаншалықты шашыраңқы екенін көрсетеді. Орташа мәндегі ондық таңба таразының дәлдігін арттырмайды: жеке мәндер бүтін граммен жазылған. Қасықтың қалай толтырылғаны әр өлшемде жазылмағандықтан, айырманы тек өнімнің қасиетімен түсіндіре алмаймыз.`,`Среднее ${f(st.mean,2)} г учитывает все пять значений, медиана ${f(st.median)} г — середина ряда. Размах ${st.range} г показывает разброс. Десятичный знак в среднем не повышает точность весов: отдельные значения записаны целыми граммами. Способ наполнения ложки не записан для каждого измерения, поэтому различия нельзя объяснять только свойствами продукта.`])}</div></div>`;
    el.querySelector("#dP").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;p=b.dataset.p;store.set("dP",p);step=6;draw()};
    el.querySelector("#dK").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;k=b.dataset.k;store.set("dK",k);step=6;draw()};
    el.querySelector("#stReset").onclick=()=>{step=1;draw()};
    const nx=el.querySelector("#stNext"); if(nx) nx.onclick=()=>{step++;draw()};
  };
  draw();
}

  el.innerHTML=`<div class="card">${tagHtml("real")}<h3 style="margin-top:8px">${B("Барлық 8 қатардың сипаттамалары, г","Характеристики всех 8 рядов, г")}</h3><div class="tw"><table><thead><tr><th>${B("Қасық","Ложка",1)}</th><th>${B("Өнім","Продукт",1)}</th><th>${B("Қатар","Ряд",1)}</th><th>${B("Қосынды","Сумма",1)}</th><th>${B("Орташа","Среднее",1)}</th><th>${B("Медиана","Медиана",1)}</th><th>${B("Мода","Мода",1)}</th><th>${B("Құлаш","Размах",1)}</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${r.k==="tsp"?B("шай","чайная",1):B("ас","столовая",1)}</td><td>${L(PN[r.p],1)}</td><td>${RAW[r.k][r.p].join(", ")}</td><td>${r.st.sum}</td><td>${f(r.st.mean,2)}</td><td>${f(r.st.median)}</td><td>${r.st.mode?modeTxt(r.st):B("жоқ","нет",1)}</td><td>${r.st.range}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="two" style="margin-top:16px"><div class="card"><h3>${B("Орташа массалар: шай және ас қасық","Средние массы: чайная и столовая ложка")}</h3>
    ${barSvg({values:DRY.flatMap(p=>[stats(RAW.tsp[p]).mean,stats(RAW.tbsp[p]).mean]),labels:DRY.flatMap(p=>[PN[p][S.lang==="ru"?1:0].slice(0,4)+"·ш",PN[p][S.lang==="ru"?1:0].slice(0,4)+"·а"]),colors:DRY.flatMap(()=>["var(--lapis)","var(--gold)"]),max:16})}
    <p class="kline">${B("Көк — шай қасық, сары — ас қасық.","Синий — чайная ложка, жёлтый — столовая.")}</p></div>
   <div class="card"><h3>${B("Ас қасық : шай қасық","Столовая : чайная")}</h3><div class="tw"><table><thead><tr><th>${B("Өнім","Продукт",1)}</th><th>${B("Шай","Чайная",1)}</th><th>${B("Ас","Столовая",1)}</th><th>${B("Қатынас","Отношение",1)}</th></tr></thead><tbody>${DRY.map(p=>{const t=stats(RAW.tsp[p]).mean,a=stats(RAW.tbsp[p]).mean;return `<tr><td>${L(PN[p],1)}</td><td>${f(t,2)}</td><td>${f(a,2)}</td><td>≈ ${f(a/t,2)}</td></tr>`}).join("")}</tbody></table></div>
    ${concl(["Қатынас өнімге қарай әртүрлі: 1,39-дан 2,26-ға дейін. Сондықтан осы өлшеулер үшін «1 ас қасық = 3 шай қасық» ережесі массамен орындалмайды. Қасықтардың көлемі өлшенбеген.","Отношение разное для разных продуктов: от 1,39 до 2,26. Поэтому для этих измерений правило «1 ст. ложка = 3 чайные» по массе не выполняется. Объём ложек не измерялся."])}</div></div>`;
}
function dataSpoon(el){
  let p=store.get("spP","sugar"),k=store.get("spK","tsp"),c=store.get("spC",2),g=store.get("spG",20);
  const draw=()=>{const m=stats(RAW[k][p]).mean;const ns=g/m, r=Math.round(ns*2)/2;
    el.innerHTML=`<div class="two"><div class="card">${tagHtml("real")}<h3 style="margin-top:8px">${B("Көмекші есеп: қасықтан грамға","Вспомогательный расчёт: ложки в граммы")}</h3>
     <div class="seg" id="spP">${DRY.map(x=>`<button type="button" data-p="${x}" aria-pressed="${x===p}">${L(PN[x],1)}</button>`).join("")}</div>
     <div class="seg" id="spK" style="margin-top:8px"><button type="button" data-k="tsp" aria-pressed="${k==="tsp"}">${B("Шай қасық","Чайная",1)}</button><button type="button" data-k="tbsp" aria-pressed="${k==="tbsp"}">${B("Ас қасық","Столовая",1)}</button></div>
     <p class="fx">${B("масса ≈ қасық саны × орташа масса","масса ≈ число ложек × средняя масса",1)}</p>
     <div class="row"><div class="fld" style="width:130px"><span class="lbl">${B("Қасық саны","Число ложек",1)}</span><input id="spC" inputmode="decimal" value="${String(c).replace(".",",")}"></div><button class="btn sm" type="button" id="spGo" style="align-self:end">OK</button></div><div class="err" id="spErr"></div>
     <p>${f(c,2)} × ${f(m,2)} ≈ <b>${f(c*m,2)} г</b></p>
     <p class="kline">${B(`Жеке өлшемдер ${stats(RAW[k][p]).min}–${stats(RAW[k][p]).max} г болды, сондықтан бұл тек жуық бағдар.`,`Отдельные измерения были ${stats(RAW[k][p]).min}–${stats(RAW[k][p]).max} г, поэтому это лишь приблизительный ориентир.`)}</p></div>
     <div class="card"><h3>${B("Кері есеп: грамнан қасыққа","Обратно: граммы в ложки")}</h3>
     <div class="row"><div class="fld" style="width:130px"><span class="lbl">${B("Масса, г","Масса, г",1)}</span><input id="spG" inputmode="decimal" value="${String(g).replace(".",",")}"></div><button class="btn sm" type="button" id="spGGo" style="align-self:end">OK</button></div><div class="err" id="spGErr"></div>
     <p>${f(g,2)} : ${f(m,2)} ≈ <b>${f(ns,2)}</b></p>
     <p>${B(`Жарты қасыққа дейін дөңгелектесек: <b>${nice(r)||"0"}</b> қасық. Сонда жуық масса: ${nice(r)||"0"} × ${f(m,2)} ≈ <b>${f(r*m,2)} г</b> (айырма ${f(r*m-g,2)} г).`,`Если округлить до половины ложки: <b>${nice(r)||"0"}</b> ложки. Тогда приблизительная масса: ${nice(r)||"0"} × ${f(m,2)} ≈ <b>${f(r*m,2)} г</b> (разница ${f(r*m-g,2)} г).`)}</p>
     ${concl(["Дөңгелектеу бір ережемен жасалады: алдымен қасық санын дөңгелектейміз, сосын сол санға сәйкес массаны көрсетеміз. Мөлшер маңызды болса, таразы қолданған дұрыс.","Округляем по одному правилу: сначала число ложек, затем показываем массу для этого числа. Если количество важно, лучше взвесить."])}</div></div>`;

function lineSvg({xmax,ymax,fns,pts,cur,xl,yl,ystep,xstep=2}){
  const W=560,H=300,L0=52,R0=20,T0=16,B0=44; const X=x=>L0+(W-L0-R0)*x/xmax, Y=y=>T0+(H-T0-B0)*(1-y/ymax);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  for(let y=0;y<=ymax+1e-9;y+=ystep)s+=`<line x1="${L0}" x2="${W-R0}" y1="${Y(y)}" y2="${Y(y)}" style="stroke:var(--line)"/><text x="${L0-6}" y="${Y(y)+4}" text-anchor="end" class="tk">${f(y,2)}</text>`;
  for(let x=0;x<=xmax;x+=xstep)s+=`<text x="${X(x)}" y="${H-B0+16}" text-anchor="middle" class="tk">${x}</text>`;
  s+=`<line x1="${L0}" x2="${W-R0}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--muted)"/><line x1="${L0}" x2="${L0}" y1="${T0}" y2="${Y(0)}" style="stroke:var(--muted)"/>`;
  s+=`<text x="${(L0+W-R0)/2}" y="${H-6}" text-anchor="middle" class="tk">${xl}</text><text x="12" y="${(T0+H-B0)/2}" text-anchor="middle" class="tk" transform="rotate(-90 12 ${(T0+H-B0)/2})">${yl}</text>`;
  fns.forEach(fn=>{let d="";for(let i=0;i<=200;i++){const x=fn.x0+(xmax-fn.x0)*i/200;const y=fn.f(x);if(y>ymax*1.02)continue;d+=(d?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)}s+=`<path d="${d}" style="fill:none;stroke:${fn.c};stroke-width:2;opacity:.55"/>`;
    for(let n=1;n<=xmax;n++){const y=fn.f(n);if(y<=ymax)s+=`<circle cx="${X(n)}" cy="${Y(y)}" r="3.2" style="fill:${fn.c}"/>`}
    const y=fn.f(cur);s+=`<line x1="${X(cur)}" x2="${X(cur)}" y1="${Y(0)}" y2="${Y(y)}" style="stroke:${fn.c};stroke-dasharray:3 3"/><circle cx="${X(cur)}" cy="${Y(y)}" r="7" style="fill:${fn.c};stroke:var(--surface);stroke-width:2.5"/>`});
  return s+"</svg>"}

      ${concl(["m : n = 50 тұрақты — бұл тура пропорционалдық. Үлес саны неше есе өссе, масса да сонша есе өседі; график координаталар басынан өтетін түзу.","m : n = 50 постоянно — это прямая пропорциональность. Во сколько раз растёт число порций, во столько же растёт масса; график — прямая через начало координат."])}</div>
     <div class="card">${tagHtml("model")}<h3 style="margin-top:8px">${B("Наурыз көже: v(n) = 3/n","Наурыз көже: v(n) = 3/n")}</h3>
      <p class="kline">${B("v — бір кеседегі көлем (л), n — кесе саны. Жалпы көлем 3 л өзгермейді.","v — объём в одной пиале (л), n — число пиал. Общий объём 3 л не меняется.")}</p>
      <label class="lbl" for="g2">n = <b>${n2}</b></label><input type="range" id="g2" min="1" max="20" step="1" value="${n2}" class="rng">

      <div class="tw"><table><thead><tr><th>n</th><th>v, л</th><th>n · v</th></tr></thead><tbody>${[6,10,12,15,n2].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).map(v=>`<tr${v===n2?' class="cur"':""}><td>${v}</td><td>${EQ(3/v,3)==="≈"?"≈ ":""}${f(3/v,3)}</td><td>${v} · 3/${v} = 3</td></tr>`).join("")}</tbody></table></div>
      ${concl(["n · v = 3 тұрақты — бұл кері пропорционалдық: кесе саны 2 есе өссе, әр кеседегі көлем 2 есе азаяды. Сызық формуланы бейнелейді, ал нақты есепте тек бүтін n мәндері (нүктелер) алынады. n = 0 болмайды — нөлге бөлуге болмайды.","n · v = 3 постоянно — это обратная пропорциональность: пиал вдвое больше — в каждой вдвое меньше. Линия изображает формулу, а на практике берутся только целые n (точки). n = 0 невозможно — на ноль делить нельзя."])}</div></div></section>`;
    document.getElementById("g1").oninput=e=>{n1=+e.target.value;store.set("g1",n1);draw();document.getElementById("g1").focus()};
    document.getElementById("g2").oninput=e=>{n2=+e.target.value;store.set("g2",n2);draw();document.getElementById("g2").focus()};
  };
  draw();
}

 calc:[

  ()=>{const s=pick([1.5,2,3,3.5,4,5]);const full=Math.floor(s/0.75+1e-9);return {t:"dep",q:[`Бір партияға 0,75 кг ұн керек. Қорда ${f(s)} кг ұн бар. Неше толық партия жасауға болады?`,`На партию нужно 0,75 кг муки. В запасе ${f(s)} кг. Сколько полных партий можно сделать?`],ans:full,sol:[`0,75n ≤ ${f(s)}; n ≤ ${f(s)} : 0,75 ${EQ(s/0.75,3)} ${f(s/0.75,3)}; ең көбі ${full} толық партия, қалдық ${f(s-0.75*full,3)} кг.`,`0,75n ≤ ${f(s)}; n ≤ ${f(s)} : 0,75 ${EQ(s/0.75,3)} ${f(s/0.75,3)}; не больше ${full} полных партий, остаток ${f(s-0.75*full,3)} кг.`]}},
  ()=>{const x=pick([[150,false],[300,false],[100,true],[50,true]]);const p=x[0]/6;return {t:"pct",q:[`600 г жент моделінде ингредиенттің массасы ${x[0]} г. Ол жалпы массаның неше пайызы?${x[1]?" (0,01-ге дейін дөңгелектеңіз)":""}`,`В модели жента 600 г масса ингредиента ${x[0]} г. Сколько это процентов от общей массы?${x[1]?" (округлите до 0,01)":""}`],ans:p,approx:x[1],sol:[`${x[0]} : 600 × 100% ${x[1]?"≈":"="} ${f(p,2)}%.`,`${x[0]} : 600 × 100% ${x[1]?"≈":"="} ${f(p,2)}%.`]}},

  ()=>{const pr=pick([[20,30],[10,20],[20,40],[15,30],[20,25]]);const k=(pr[1]/pr[0])**2;return {t:"geo",q:[`Шелпектің диаметрі ${pr[0]} см-ден ${pr[1]} см-ге өсті. Аудан неше есе өсті?`,`Диаметр шелпека увеличился с ${pr[0]} до ${pr[1]} см. Во сколько раз увеличилась площадь?`],ans:k,sol:[`(${pr[1]}/${pr[0]})² = ${f(pr[1]/pr[0],3)}² = ${f(k,4)}.`,`(${pr[1]}/${pr[0]})² = ${f(pr[1]/pr[0],3)}² = ${f(k,4)}.`]}},

 ],
 cmp:[

function pageTasks(){

    if(cur.opts){const idx=cur.opts.map((_,i)=>i).sort(()=>Math.random()-.5);cur.opts=idx.map(i=>cur.opts[i]);cur.ok=idx.indexOf(cur.ok)}draw()};
  const draw=()=>{
    view.innerHTML=`<section class="sec"><div class="sec-h"><div><h2>${B("Есеп шығарып көр","Реши задачу")}</h2><p class="lead">${B("Әр есепте шешуге қажет барлық дерек берілген. Жауаптан кейін шешімі мен мағынасы көрсетіледі.","В каждой задаче даны все нужные данные. После ответа показываются решение и смысл.")}</p></div><span class="pill exp num">${B("Дұрыс","Верно",1)}: ${score.ok} / ${score.all}</span></div>
     ${tabs("tLv",LV,lvl)}
     <div class="card" style="margin-top:14px"><div class="meta"><span class="pill mut">${L(TOPICS[cur.t],1)}</span></div><p style="font-size:1.1rem;margin:10px 0">${L(cur.q)}</p>
      ${cur.opts?`<div class="opts">${cur.opts.map((o,i)=>`<button class="opt" type="button" data-o="${i}" ${answered?"disabled":""}>${L(o)}</button>`).join("")}</div>`
      :`<div class="row"><div class="fld" style="width:180px"><input id="ans" inputmode="decimal" placeholder="12,5 · 3/4 · 1 1/8" aria-label="жауап"></div><button class="btn" type="button" id="chk">${B("Тексеру","Проверить",1)}</button></div><p class="kline">${B("Ондық бөлшекті үтірмен де, нүктемен де жазуға болады; жай бөлшек: 3/4, аралас сан: 1 1/8.","Десятичные можно писать через запятую или точку; дробь: 3/4, смешанное число: 1 1/8.")}</p>`}
      <div id="res" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" type="button" id="nxt">${B("Келесі есеп","Следующая задача",1)}</button></div></div></section>`;
    document.getElementById("tLv").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;lvl=b.dataset.t;store.set("tLvl",lvl);next()};
    document.getElementById("nxt").onclick=next;
    const res=document.getElementById("res");
    const show=ok=>{score={ok:score.ok+(ok?1:0),all:score.all+1};store.set("tScore",score);answered=true;
      res.innerHTML=`${ok?`<span class="okt">${B("Дұрыс!","Верно!",1)}</span>`:`<span class="err">${B("Дұрыс емес.","Неверно.",1)}</span>`}<div class="concl" style="margin-top:8px"><span class="eyebrow">${B("Шешімі","Решение",1)}</span><p>${L(cur.sol)}</p></div>`;
      document.querySelector(".pill.exp.num").innerHTML=`${B("Дұрыс","Верно",1)}: ${score.ok} / ${score.all}`};
    if(cur.opts) view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(answered)return;const ok=+b.dataset.o===cur.ok;view.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;if(+x.dataset.o===cur.ok)x.classList.add("right");else if(x===b)x.classList.add("wrong")});show(ok)});
    else{const chk=()=>{if(answered)return;const v=parseAns(document.getElementById("ans").value);if(v===null){res.innerHTML=`<span class="err">${B("Жауапты санмен жазыңыз (мысалы, 12,5 немесе 3/4).","Введите ответ числом (например, 12,5 или 3/4).",1)}</span>`;return}
      let ok; if(cur.ans==="none") ok=v==="none"; else if(v==="none") ok=false; else ok=cur.approx?Math.abs(v-cur.ans)<=0.011:Math.abs(v-cur.ans)<1e-6; show(ok)};
      document.getElementById("chk").onclick=chk; document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")chk()};}
  };
  next();
}

// ===================== ДАСТАРХАН (пропорцияның қолданылуы) =====================
function pagePlan(){
  const ids=Object.keys(S.plan).filter(id=>R.find(r=>r.id===id));
  const agg={}; ids.forEach(id=>{const r=R.find(x=>x.id===id);const k=S.plan[id]/r.base;r.ing.forEach(([key,v,fry])=>{agg[key]=(agg[key]||0)+(fry?v:v*k)})});
  const keys=Object.keys(FOOD).filter(k=>agg[k]&&k!=="water"); S.packs=S.packs||{};
  let used=0,buy=0,buyAll=true;
  const rows=keys.map(key=>{const F=FOOD[key];const q=agg[key];const pr=priceOf(key);const c=F.pu==="pc"?q*pr:(q/1000)*pr;used+=c;
    const pk=parseNum(S.packs[key]);let packTxt="—",packCost=null;if(pk&&F.u!=="pc"){const n=Math.ceil(q/pk-1e-9);packCost=n*pk/1000*pr;packTxt=`${n} × ${f0(pk)} ${F.u==="g"?"г":"мл"}`}else if(F.u==="pc"){packCost=Math.ceil(q-1e-9)*pr;packTxt=`${Math.ceil(q-1e-9)} ${B("дана","шт.",1)}`}
    if(packCost===null)buyAll=false;else buy+=packCost;
    const qty=F.u==="g"?(q>=1000?`${f(q/1000,3)} кг`:`${f(q,1)} г`):F.u==="ml"?(q>=1000?`${f(q/1000,3)} л`:`${f(q,1)} мл`):`${f(q,2)} ${B("дана","шт.",1)}`;
    const unitLbl=F.pu==="kg"?"₸/кг":F.pu==="l"?"₸/л":B("₸/дана","₸/шт.",1);
    return `<tr><td>${L(F.n,1)}</td><td>${qty}</td><td><input id="pr_${key}" inputmode="decimal" value="${S.prices[key]===undefined?F.price:esc(S.prices[key])}" aria-label="баға"> <span class="kline">${unitLbl}</span>${priceIsExample(key)&&F.price?` <span class="pill mut">${B("мысал","пример",1)}</span>`:""}</td><td>${f0(c)} ₸</td><td>${F.u==="pc"?"—":`<input id="pk_${key}" inputmode="numeric" value="${esc(S.packs[key]||"")}" placeholder="—" aria-label="қаптама"> ${F.u==="g"?"г":"мл"}`}</td><td>${packTxt}${packCost!==null?`<br><b>${f0(packCost)} ₸</b>`:""}</td></tr>`}).join("");
  const g=S.guests||10;
  view.innerHTML=`<section class="sec"><div class="sec-h"><div><h2>${B("Дастархан жоспарлаушы","Планировщик дастархана")}</h2><p class="lead">${B("Пропорцияның практикада қолданылуы: әр тағамның порция санын бөлек жазыңыз — қонақ саны әр тағамның порция санымен бірдей болмауы мүмкін.","Пропорции на практике: укажите число порций каждого блюда отдельно — число гостей не всегда равно числу порций каждого блюда.")}</p></div></div>
   <div class="stack"><div class="card">${tagHtml("user")}
     <div class="row" style="margin-top:8px"><div class="fld" style="width:140px"><span class="lbl">${B("Қонақ саны","Гостей",1)}</span><input id="guests" inputmode="numeric" value="${g}"></div><button class="btn sm ghost" type="button" id="fillG" style="align-self:end">${B("Таңдалғанға «1 қонаққа 1 порция» қою","Поставить «1 порция на гостя»",1)}</button></div>
     <div class="pgrid">${R.map(r=>`<label class="pq"><span>${L(r.t,1)}</span><span class="pqv"><input id="pq_${r.id}" inputmode="numeric" value="${S.plan[r.id]??""}" placeholder="0"> <span class="kline" style="margin:0">${L(r.u,1)}</span></span></label>`).join("")}</div>
     <div class="row" style="margin-top:10px"><button class="btn" type="button" id="pUpd">${B("Есептеу","Посчитать",1)}</button><button class="btn ghost" type="button" id="pClr">${B("Тазалау","Очистить",1)}</button><span class="err" id="pErr"></span></div></div>
    <div class="card"><h3>${B("Сатып алу тізімі","Список покупок")}</h3>
     ${keys.length?`<div class="tw"><table><thead><tr><th>${B("Өнім","Продукт",1)}</th><th>${B("Керек","Нужно",1)}</th><th>${B("Баға","Цена",1)}</th><th>${B("Қолданылған бөлігі","Использованная часть",1)}</th><th>${B("Қаптама","Упаковка",1)}</th><th>${B("Сатып алу","Покупка",1)}</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><th>${B("Барлығы","Итого",1)}</th><th></th><th></th><th>${f0(used)} ₸</th><th></th><th>${buyAll?f0(buy)+" ₸":B("қаптама көлемін жазыңыз","укажите размер упаковок",1)}</th></tr></tfoot></table></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" type="button" id="prSave">${B("Баға мен қаптаманы сақтау","Сохранить цены и упаковки",1)}</button><span class="kline" id="prMsg"></span></div>
      <p class="kline">${B("«Қолданылған бөлігі» — рецептке кеткен мөлшердің құны. «Сатып алу» — толық қаптамалардың құны (қаптама көлемін өзіңіз жазасыз). «Мысал» деп белгіленген бағалар шамамен алынған, дүкеннің ағымдағы бағасы емес. Қуыруға арналған май әр тағамға бір рет есептеледі.","«Использованная часть» — стоимость того, что ушло в рецепт. «Покупка» — стоимость целых упаковок (размер упаковки вводите сами). Цены с пометкой «пример» приблизительные, это не текущие цены магазина. Масло для жарки учитывается один раз на блюдо.")}</p>`
     :`<p class="lead">${B("Әлі тағам таңдалмаған. Сол жақта порция санын жазып, «Есептеу» батырмасын басыңыз.","Блюда ещё не выбраны. Укажите число порций слева и нажмите «Посчитать».")}</p>`}</div></div></section>`;
  const read=()=>{const np={};for(const r of R){const raw=document.getElementById("pq_"+r.id).value.trim();if(raw===""||raw==="0")continue;const c=chk(raw,{int:true,max:5000,what:r.t});if(c.err){document.getElementById("pErr").innerHTML=c.err;return null}np[r.id]=c.v}return np};
  const gv=()=>{const c=chk(document.getElementById("guests").value,{int:true,max:1000,what:["Қонақ саны","Число гостей"]});if(c.err){document.getElementById("pErr").innerHTML=c.err;return null}return c.v};
  document.getElementById("pUpd").onclick=()=>{const g2=gv();if(g2===null)return;S.guests=g2;const np=read();if(!np)return;S.plan=np;save();pagePlan()};
  document.getElementById("fillG").onclick=()=>{const g2=gv();if(g2===null)return;S.guests=g2;const np=read();if(!np)return;if(!Object.keys(np).length){document.getElementById("pErr").innerHTML=B("Алдымен тағамдарды таңдаңыз (санына 1 жазыңыз).","Сначала выберите блюда (поставьте 1).",1);return}for(const id in np)np[id]=g2;S.plan=np;save();pagePlan()};
  document.getElementById("pClr").onclick=()=>{S.plan={};save();pagePlan()};
  const ps=document.getElementById("prSave"); if(ps) ps.onclick=()=>{const msg=document.getElementById("prMsg");for(const key of keys){const raw=document.getElementById("pr_"+key).value.trim();let pr="0";if(raw!==""){const c=chk(raw,{zero:true,max:1e7,what:FOOD[key].n});if(c.err){msg.innerHTML=`<span class="err">${c.err}</span>`;return}pr=String(c.v)}const pkEl=document.getElementById("pk_"+key);let pk=null;if(pkEl){const pv=pkEl.value.trim();if(pv!==""){const c=chk(pv,{int:true,max:1e6,what:[FOOD[key].n[0]+" — қаптама",FOOD[key].n[1]+" — упаковка"]});if(c.err){msg.innerHTML=`<span class="err">${c.err}</span>`;return}pk=String(c.v)}else pk=""}S.prices[key]=pr;if(pk!==null)S.packs[key]=pk}save();pagePlan()};
}

const MODROUTES=["scale","scale-bauyrsak","scale-percent","data","data-mine","portions","graphs","shelpek"];
function route(force){
  const h=force||(location.hash||"#home").slice(1)||"home";
  const tab=h.startsWith("r-")?"recipes":(h==="data"||h==="data-mine"||h==="mylab")?"data":MODROUTES.includes(h)?"mods":h;
  document.querySelectorAll("#dnav [data-go],#mnav [data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===tab?"page":"false"));
  const mn=document.getElementById("mnav"); mn.hidden=true; document.getElementById("burger").setAttribute("aria-expanded","false");
  if(h.startsWith("r-")) pageRecipe(h.slice(2));
  else if(h==="scale-bauyrsak") pageScale("bauyrsak"); else if(h==="scale-percent") pageScale("percent"); else if(h==="scale") pageScale("zhent");
  else if(h==="data-mine"||h==="mylab") pageData("mine");
  else ({home:pageHome,mods:pageMods,recipes:pageRecipes,data:()=>pageData("main"),portions:pagePortions,graphs:pageGraphs,shelpek:pageShelpek,tasks:pageTasks,plan:pagePlan,album:pageAlbum,about:pageAbout,more:pageMore}[h]||pageHome)();
  decorate(h,tab); renderFoot();
  window.scrollTo(0,0);
}

function decorate(h,tab){
  if(h==="home"||h.startsWith("r-"))return;
  const sh=view.querySelector(":scope > .sec:first-child > .sec-h"); if(!sh)return;
  sh.classList.add("phead");

  let html=`<button type="button" data-go="home">${B("Басты","Главная",1)}</button><span>/</span>`;
  if(tab==="mods"&&h!=="mods") html+=`<button type="button" data-go="mods">${B("Модульдер","Модули",1)}</button><span>/</span>`;
  const t=sh.querySelector("h2"); html+=`<span>${t?t.innerHTML:""}</span>`;
  cr.innerHTML=html; sh.prepend(cr);
}
